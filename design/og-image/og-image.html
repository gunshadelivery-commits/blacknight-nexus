<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<!-- ต้นแบบรูปตัวอย่างลิงก์ (og:image) 1200×630 — ถ่ายภาพหน้าจอด้วย Chrome headless แล้วแปลงเป็น JPG ไปไว้ที่ image/og-siam-cannabis.jpg
     ข้อความทั้งหมดอยู่ในกรอบกลาง 630px เพราะ LINE ตัดรูปเป็นสี่เหลี่ยมจัตุรัสตรงกลาง -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+Thai:wght@500;700;800&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(520px 520px at 50% 46%, rgba(12,159,76,.42), rgba(12,159,76,0) 70%),
      radial-gradient(420px 420px at 4% 100%, rgba(73,232,131,.20), rgba(73,232,131,0) 70%),
      radial-gradient(420px 420px at 96% 0%, rgba(73,232,131,.20), rgba(73,232,131,0) 70%),
      #030907;
    font-family: "Inter", "Noto Sans Thai", "Leelawadee UI", sans-serif;
    color: #fff;
  }
  .ring { position: absolute; border: 1.5px solid rgba(143,255,183,.14); border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .r1 { width: 700px; height: 700px; }
  .r2 { width: 940px; height: 940px; border-color: rgba(143,255,183,.09); }
  .r3 { width: 1180px; height: 1180px; border-color: rgba(143,255,183,.06); }
  .safe {
    position: absolute; left: 50%; top: 0; width: 600px; height: 630px; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .tile {
    width: 148px; height: 148px; border-radius: 36px; background: #f4f7f2;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 60px rgba(73,232,131,.35), 0 0 0 1px rgba(255,255,255,.5) inset;
  }
  .tile img { width: 116px; height: 116px; }
  .name { margin-top: 30px; font-weight: 800; font-size: 74px; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
  .place { margin-top: 14px; font-weight: 700; font-size: 22px; letter-spacing: 0.32em; color: #8fffb7; padding-left: 0.32em; }
  .th { margin-top: 30px; font-weight: 700; font-size: 36px; line-height: 1.3; white-space: nowrap; }
  .chips { margin-top: 22px; display: flex; gap: 10px; }
  .chip {
    font-weight: 700; font-size: 21px; line-height: 1; color: #8fffb7; white-space: nowrap;
    padding: 12px 16px; border-radius: 999px; background: rgba(143,255,183,.10); border: 1.5px solid rgba(143,255,183,.34);
  }
</style>
</head>
<body>
  <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
  <div class="safe">
    <div class="tile"><img src="../../image/icon-512.png" alt=""></div>
    <div class="name">Siam Cannabis</div>
    <div class="place">ON NUT · BANGKOK</div>
    <div class="th">กัญชาส่งด่วน อ่อนนุช · สุขุมวิท</div>
    <div class="chips">
      <span class="chip">ถึงมือ ~1 ชม.</span>
      <span class="chip">จ่ายปลายทาง</span>
      <span class="chip">20+ เท่านั้น</span>
    </div>
  </div>
</body>
</html>
