<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- เริ่มดึงข้อมูลสินค้าทันที ไม่ต้องรอ JS โหลดเสร็จ (strain.js รับช่วงต่อจาก window.__catalogCsv) -->
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="dns-prefetch" href="https://i.ibb.co">
    <script>
        (function () {
            var url = '%VITE_SHEET_CSV_URL%';
            if (url.indexOf('http') !== 0) return;
            try { if (sessionStorage.getItem('sc_sheet_cache')) return; } catch (e) {}
            window.__catalogCsv = fetch(url + '&t=' + Date.now()).then(function (r) {
                if (!r.ok) throw new Error('csv ' + r.status);
                return r.text();
            });
            window.__catalogCsv.catch(function () {});
        })();
    </script>

    <title>Cannabis Strain Bangkok | Siam Cannabis On Nut · กัญชาส่งด่วน สุขุมวิท</title>
    <meta name="description" content="กัญชาส่งด่วน Bangkok — Premium Sativa, Indica & Hybrid strains at Siam Cannabis On Nut. Express delivery Sukhumvit, Phra Khanong, Udom Suk. Tourists & expats welcome. Age 20+.">

    <meta property="og:type" content="product">
    <meta property="og:site_name" content="Siam Cannabis Bangkok">
    <meta property="og:image" content="https://blacknight69.com/og-image.jpg">
    <meta property="og:locale" content="en_US">
    <script type="application/ld+json" id="strain-schema">{"@context":"https://schema.org","@type":"Product","name":"Cannabis Strain","brand":{"@type":"Brand","name":"Siam Cannabis"}}</script>
    <!-- ssr:head-end -->

    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Fonts -->
    <!-- โหลดแบบไม่บล็อกการแสดงผล: หน้าเว็บขึ้นด้วยฟอนต์ของเครื่องก่อน แล้วสลับเมื่อฟอนต์มาถึง -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Noto+Sans+Thai:wght@300..900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Noto+Sans+Thai:wght@300..900&display=swap" rel="stylesheet"></noscript>

    <!-- Google Analytics 4 — โหลดเฉพาะบนโดเมนจริง: เปิดจาก localhost / preview / โดเมนอื่นจะไม่ส่งข้อมูลเข้า GA4 (gtag() ยังเรียกได้ แค่ไม่ถูกส่ง) -->

        gtag('js', new Date());
        gtag('config', 'G-70NV9ZCP1L');
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-70NV9ZCP1L';
        document.head.appendChild(s);
      })();

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #4ade80;
            --green-dim: rgba(74,222,128,0.15);
            --text: #e7f4eb;
            --muted: rgba(231,244,235,0.64);       /* ตัวหนังสือรอง (contrast ~7:1 บนพื้น --bg) */
            --muted-strong: rgba(231,244,235,0.78);
            --bg: #030d06;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.07);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Noto Sans Thai", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav {
            position: sticky; top: 0; z-index: 50;
            background: rgba(3,13,6,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            height: 56px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo { font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
        .nav-logo span { color: var(--green); }
        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .nav-back {
            display: flex; align-items: center; gap: 6px;
            color: var(--muted-strong); font-size: 13px; font-weight: 600;
            text-decoration: none; transition: color 160ms;
            min-height: 40px;
        }
        .nav-back:hover { color: var(--text); }
        @media (max-width: 520px) {
            /* จอแคบ: เหลือลูกศรอย่างเดียว (aria-label บอกปลายทาง) ให้พอที่กับปุ่มสลับภาษา */
            .nav-back span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
            .nav-back { min-width: 40px; justify-content: center; }
        }

        /* ปุ่มสลับภาษา (ใช้ทั้งใน nav และในหน้ายืนยันอายุ) */
        .language-switcher { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid rgba(255,255,255,.13); border-radius: 12px; background: rgba(5,20,12,.72); }
        .language-switcher button { min-width: 34px; min-height: 30px; padding: 0 8px; border: 0; border-radius: 9px; background: none; color: rgba(255,255,255,.62); font: inherit; font-size: 10px; font-weight: 800; letter-spacing: .06em; cursor: pointer; }
        .language-switcher button.is-active { color: #062414; background: #8fffb7; }
        @media (max-width: 380px) { .language-switcher button { min-width: 28px; padding: 0 5px; } }

        :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

        /* Main layout */
        .container { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }

        /* Breadcrumb */
        .breadcrumb { font-size: 11px; color: var(--muted); margin-bottom: 24px; }
        .breadcrumb a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }

        /* Hero grid */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: start;
        }
        @media (max-width: 640px) { .hero-grid { grid-template-columns: 1fr; } }

        /* Image */
        .strain-image-wrap {
            position: relative;
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .strain-image-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 400ms ease;
        }
        .strain-image-wrap:hover img { transform: scale(1.04); }
        .strain-image-placeholder {
            font-size: 80px; opacity: 0.3;
        }
        .sold-out-flag {
            position: absolute; left: 12px; top: 12px;
            background: #b91c1c; color: #fff; font-size: 11px; font-weight: 800;
            padding: 6px 12px; border-radius: 999px; letter-spacing: 0.04em;
        }
        .sold-out-hint {
            font-size: 13px; line-height: 1.6; color: #fde68a;
            background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.25);
            border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
        }

        /* แท็กจากชีต (THC %, สัดส่วนสายพันธุ์ ฯลฯ) */
        .strain-tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
        .strain-tags li {
            font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
            background: var(--card); border: 1px solid var(--border); color: var(--muted-strong);
        }

        /* Info panel */
        .strain-type-badge {
            display: inline-block;
            font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
            padding: 4px 10px; border-radius: 6px; margin-bottom: 12px;
        }
        .badge-sativa { background: rgba(251,146,60,0.15); color: #fb923c; border: 1px solid rgba(251,146,60,0.3); }
        .badge-indica { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
        .badge-hybrid { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
        .badge-preroll { background: rgba(250,204,21,0.12); color: #fbbf24; border: 1px solid rgba(250,204,21,0.25); }
        .badge-default { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }

        .strain-name {
            font-size: 28px; font-weight: 800; line-height: 1.2;
            margin-bottom: 6px;
        }
        .strain-tagline {
            font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5;
        }

        /* Perfect For */
        .perfect-for-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
            color: var(--muted); margin-bottom: 6px;
        }
        .perfect-for-tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
        }
        .perfect-tag {
            font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
            padding: 5px 10px; border-radius: 8px;
            background: var(--green-dim); color: var(--green);
            border: 1px solid rgba(74,222,128,0.2);
        }

        /* Divider */
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

        /* Attributes */
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .attr-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 14px;
        }
        .attr-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
        .attr-value { font-size: 14px; font-weight: 700; color: var(--text); }

        /* Pricing */
        .price-section { margin-bottom: 20px; }
        .price-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.05em; }
        .variants-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .variant-btn {
            padding: 8px 16px; border-radius: 10px; cursor: pointer;
            border: 1px solid var(--border); background: var(--card);
            color: var(--muted); font-size: 13px; font-weight: 600;
            transition: all 160ms;
        }
        .variant-btn { min-height: 40px; font-family: inherit; }
        .variant-btn.is-active {
            background: var(--green-dim); border-color: rgba(74,222,128,0.4);
            color: var(--green);
        }
        .variant-btn.is-empty { opacity: 0.55; text-decoration: line-through; }
        .price-display {
            font-size: 28px; font-weight: 800; color: var(--text);
            margin-bottom: 16px;
        }
        .price-display .currency { font-size: 16px; color: var(--muted); margin-left: 4px; }

        /* CTA buttons */
        .cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-primary {
            flex: 1; min-width: 140px;
            background: var(--green); color: #031a07;
            font-size: 14px; font-weight: 800; letter-spacing: 0.02em;
            padding: 14px 20px; border-radius: 14px; border: none; cursor: pointer;
            transition: all 160ms;
        }
        .btn-primary { font-family: inherit; min-height: 48px; }
        .btn-primary:hover { background: #86efac; }
        .btn-primary:disabled { background: rgba(255,255,255,0.12); color: var(--muted-strong); cursor: not-allowed; }
        .btn-line {
            flex: 1; min-width: 140px;
            background: #06c755; color: #fff;
            font-size: 14px; font-weight: 800;
            padding: 14px 20px; border-radius: 14px; border: none; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 160ms;
        }
        .btn-line { min-height: 48px; }
        .btn-line:hover { background: #05a845; }

        /* แถบสั่งซื้อติดขอบล่างบนมือถือ: โผล่เมื่อปุ่มหลักเลื่อนพ้นจอ (strain.js) */
        .sticky-cta { display: none; }
        @media (max-width: 640px) {
            .sticky-cta:not([hidden]) {
                display: flex; align-items: center; gap: 8px;
                position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
                padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
                background: rgba(3,13,6,0.94); backdrop-filter: blur(16px);
                border-top: 1px solid var(--border);
            }
            .sticky-cta-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
            .sticky-cta-name { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .sticky-cta-price { font-size: 12px; color: var(--muted-strong); }
            .sticky-cta .btn-primary { flex: 0 0 auto; min-width: 0; padding: 12px 16px; }
            .sticky-cta .btn-line { flex: 0 0 48px; min-width: 0; padding: 0; }
        }

        /* Description */
        .section-title {
            font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
            color: var(--muted); margin-bottom: 12px;
        }
        .desc-en {
            font-size: 14px; line-height: 1.7; color: rgba(231,244,235,0.72);
            margin-bottom: 16px;
        }
        .desc-th {
            font-size: 14px; line-height: 1.8; color: rgba(231,244,235,0.78);
            margin-bottom: 10px;
        }
        .desc-legal { font-size: 12px; color: var(--muted); margin-bottom: 0; }
        .about-box {
            margin-top: 40px; background: rgba(255,255,255,0.02);
            border: 1px solid var(--border); border-radius: 16px; padding: 24px;
        }
        .about-box + .about-box { margin-top: 16px; }
        .about-box .desc-en:last-child { margin-bottom: 0; }
        .about-heading { font-size: 18px; font-weight: 800; line-height: 1.4; margin-bottom: 12px; }

        /* Gallery */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; margin-top: 12px;
        }
        .gallery-thumb {
            aspect-ratio: 1; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border); cursor: pointer;
            padding: 0; background: none; display: block; width: 100%;
        }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* Loading / error */
        .loading-state { text-align: center; padding: 80px 16px; color: var(--muted); }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid rgba(74,222,128,0.2);
            border-top-color: var(--green); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Related section */
        .related-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px; margin-top: 12px;
        }
        .related-card {
            display: flex; flex-direction: column;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 10px 10px 12px; text-decoration: none; color: var(--text);
            transition: border-color 200ms, background 200ms;
        }
        .related-card img { width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 10px; margin-bottom: 10px; background: rgba(255,255,255,0.04); }
        .browse-all {
            display: inline-block; background: var(--green); color: #031a07; font-weight: 800; font-size: 14px;
            padding: 12px 28px; border-radius: 12px; text-decoration: none;
        }
        .related-card:hover { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.05); }
        .related-type { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--green); margin-bottom: 4px; }
        .related-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .related-price { font-size: 12px; color: var(--muted-strong); }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="/" class="nav-logo">Siam <span>Cannabis</span></a>
        <div class="nav-actions">
            <div class="language-switcher" role="group" data-i18n-aria="language.label" aria-label="Select language">
                <button type="button" data-language-option="th" data-i18n-title="language.thai">TH</button>
                <button type="button" data-language-option="en" data-i18n-title="language.english">EN</button>
                <button type="button" data-language-option="zh" data-i18n-title="language.chinese" lang="zh">中文</button>
                <button type="button" data-language-option="ko" data-i18n-title="language.korean" lang="ko">한국</button>
            </div>
            <a href="/#products" class="nav-back" id="back-btn" aria-label="Back to Shop">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                <span id="back-label">Back to Shop</span>
            </a>
        </div>
    </nav>

    <main class="container" id="main-content">
        <!-- ssr:body-start — ตอน build scripts/prerender.mjs แทนที่ช่วงนี้ด้วยเนื้อหาของแต่ละสายพันธุ์ -->
        <div class="loading-state" id="loading">
            <div class="loading-spinner"></div>
            <p>Loading strain info…</p>
        </div>
        <div id="strain-content" style="display:none;"></div>
        <!-- ssr:body-end -->
    </main>

    <script type="module" src="/src/strain.js"></script>
</body>
</html>
