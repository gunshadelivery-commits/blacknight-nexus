    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --green: #4ade80;
            --green-dim: rgba(74,222,128,0.15);
            --text: #e7f4eb;
            --muted: rgba(231,244,235,0.45);
            --bg: #030d06;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.07);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Noto Sans Thai", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav {
            position: sticky; top: 0; z-index: 50;
            background: rgba(3,13,6,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
            height: 56px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo { font-size: 18px; font-weight: 800; color: #fff; text-decoration: none; }
        .nav-logo span { color: var(--green); }
        .nav-back {
            display: flex; align-items: center; gap: 6px;
            color: var(--muted); font-size: 13px; font-weight: 600;
            text-decoration: none; transition: color 160ms;
        }
        .nav-back:hover { color: var(--text); }

        /* Main layout */
        .container { max-width: 900px; margin: 0 auto; padding: 32px 16px 80px; }

        /* Breadcrumb */
        .breadcrumb { font-size: 11px; color: var(--muted); margin-bottom: 24px; }
        .breadcrumb a { color: var(--green); text-decoration: none; }
        .breadcrumb a:hover { text-decoration: underline; }

        /* Hero grid */
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            align-items: start;
        }
        @media (max-width: 640px) { .hero-grid { grid-template-columns: 1fr; } }

        /* Image */
        .strain-image-wrap {
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .strain-image-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 400ms ease;
        }
        .strain-image-wrap:hover img { transform: scale(1.04); }
        .strain-image-placeholder {
            font-size: 80px; opacity: 0.3;
        }

        /* Info panel */
        .strain-type-badge {
            display: inline-block;
            font-size: 10px; font-weight: 800; letter-spacing: 0.12em;
            padding: 4px 10px; border-radius: 6px; margin-bottom: 12px;
        }
        .badge-sativa { background: rgba(251,146,60,0.15); color: #fb923c; border: 1px solid rgba(251,146,60,0.3); }
        .badge-indica { background: rgba(139,92,246,0.15); color: #a78bfa; border: 1px solid rgba(139,92,246,0.3); }
        .badge-hybrid { background: rgba(74,222,128,0.12); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }
        .badge-preroll { background: rgba(250,204,21,0.12); color: #fbbf24; border: 1px solid rgba(250,204,21,0.25); }
        .badge-default { background: var(--green-dim); color: var(--green); border: 1px solid rgba(74,222,128,0.25); }

        .strain-name {
            font-size: 28px; font-weight: 800; line-height: 1.2;
            margin-bottom: 6px;
        }
        .strain-tagline {
            font-size: 14px; color: var(--muted); margin-bottom: 20px; line-height: 1.5;
        }

        /* Perfect For */
        .perfect-for-label {
            font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
            color: var(--muted); margin-bottom: 6px;
        }
        .perfect-for-tags {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
        }
        .perfect-tag {
            font-size: 11px; font-weight: 800; letter-spacing: 0.08em;
            padding: 5px 10px; border-radius: 8px;
            background: var(--green-dim); color: var(--green);
            border: 1px solid rgba(74,222,128,0.2);
        }

        /* Divider */
        .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

        /* Attributes */
        .attr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .attr-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 12px 14px;
        }
        .attr-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
        .attr-value { font-size: 14px; font-weight: 700; color: var(--text); }

        /* Pricing */
        .price-section { margin-bottom: 20px; }
        .price-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 8px; letter-spacing: 0.05em; }
        .variants-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .variant-btn {
            padding: 8px 16px; border-radius: 10px; cursor: pointer;
            border: 1px solid var(--border); background: var(--card);
            color: var(--muted); font-size: 13px; font-weight: 600;
            transition: all 160ms;
        }
        .variant-btn.is-active {
            background: var(--green-dim); border-color: rgba(74,222,128,0.4);
            color: var(--green);
        }
        .price-display {
            font-size: 28px; font-weight: 800; color: var(--text);
            margin-bottom: 16px;
        }
        .price-display .currency { font-size: 16px; color: var(--muted); margin-left: 4px; }

        /* CTA buttons */
        .cta-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-primary {
            flex: 1; min-width: 140px;
            background: var(--green); color: #031a07;
            font-size: 14px; font-weight: 800; letter-spacing: 0.02em;
            padding: 14px 20px; border-radius: 14px; border: none; cursor: pointer;
            transition: all 160ms;
        }
        .btn-primary:hover { background: #86efac; }
        .btn-line {
            flex: 1; min-width: 140px;
            background: #06c755; color: #fff;
            font-size: 14px; font-weight: 800;
            padding: 14px 20px; border-radius: 14px; border: none; cursor: pointer;
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 160ms;
        }
        .btn-line:hover { background: #05a845; }

        /* Description */
        .section-title {
            font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
            color: var(--muted); margin-bottom: 12px;
        }
        .desc-en {
            font-size: 14px; line-height: 1.7; color: rgba(231,244,235,0.72);
            margin-bottom: 16px;
        }
        .desc-th {
            font-size: 14px; line-height: 1.8; color: var(--muted);
        }

        /* Gallery */
        .gallery-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px; margin-top: 12px;
        }
        .gallery-thumb {
            aspect-ratio: 1; border-radius: 10px; overflow: hidden;
            border: 1px solid var(--border); cursor: pointer;
        }
        .gallery-thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* Loading / error */
        .loading-state { text-align: center; padding: 80px 16px; color: var(--muted); }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid rgba(74,222,128,0.2);
            border-top-color: var(--green); border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Related section */
        .related-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px; margin-top: 12px;
        }
        .related-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 14px; padding: 14px; text-decoration: none; color: var(--text);
            transition: border-color 200ms, background 200ms;
        }
        .related-card:hover { border-color: rgba(74,222,128,0.3); background: rgba(74,222,128,0.05); }
        .related-type { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; color: var(--green); margin-bottom: 4px; }
        .related-name { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
        .related-price { font-size: 12px; color: var(--muted); }
    </style>
